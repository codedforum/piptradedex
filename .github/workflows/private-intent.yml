name: private-intent

on:
  push:
    paths: ['private-intent/**', '.github/workflows/private-intent.yml']
  pull_request:
    paths: ['private-intent/**', '.github/workflows/private-intent.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-intent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-intent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
